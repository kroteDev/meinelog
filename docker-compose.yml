services:
  web:
    container_name: meinelog_ai_web
    build: ./web
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      WEB_HOST: ${WEB_HOST}
      WEB_PORT: ${WEB_PORT}
    ports:
      - "${WEB_PORT}:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped


  api:
    container_name: meinelog_ai_api
    build: ./api
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "rm -f tmp/pids/server.pid && bundle install && rails server -b 0.0.0.0"
    environment:
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      WEB_HOST: ${WEB_HOST}
      WEB_PORT: ${WEB_PORT}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_PORT: ${DATABASE_PORT}
    ports:
      - "${API_PORT}:3000"
    volumes:
      - ./api:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped


  postgres:
    container_name: meinelog_ai_postgresql
    image: postgres:17
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - meinelog_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  meinelog_ai_postgres_data:
